    &lt;label class=&quot;form-label&quot;&gt;&lt;span class=&quot;gm-weight-label&quot;&gt;&lt;span&gt;Probe latitude λ&lt;/span&gt;&lt;output id=&quot;gm-lat-value&quot; class=&quot;tabular-nums&quot;&gt;30° N&lt;/output&gt;&lt;/span&gt;&lt;input id=&quot;gm-lat&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;-85&quot; max=&quot;85&quot; step=&quot;1&quot; value=&quot;30&quot; aria-label=&quot;Probe latitude&quot;&gt;&lt;/label&gt;
    &lt;label class=&quot;form-label&quot;&gt;&lt;span class=&quot;gm-weight-label&quot;&gt;&lt;span&gt;Probe / slice longitude φ&lt;/span&gt;&lt;output id=&quot;gm-lon-value&quot; class=&quot;tabular-nums&quot;&gt;0°&lt;/output&gt;&lt;/span&gt;&lt;input id=&quot;gm-lon&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;-180&quot; max=&quot;180&quot; step=&quot;1&quot; value=&quot;0&quot; aria-label=&quot;Probe longitude&quot;&gt;&lt;/label&gt;
  &lt;/div&gt;
  &lt;div class=&quot;gm-plot-heading&quot;&gt;&lt;h3 id=&quot;gm-slice-title&quot;&gt;Inclination · longitude 0° slice&lt;/h3&gt;&lt;div class=&quot;gm-chart-legend text-small&quot;&gt;&lt;button type=&quot;button&quot; data-series=&quot;total&quot; aria-pressed=&quot;true&quot;&gt;&lt;i class=&quot;gm-line gm-total&quot;&gt;&lt;/i&gt;Combined&lt;/button&gt;&lt;button type=&quot;button&quot; data-series=&quot;gad&quot; aria-pressed=&quot;true&quot;&gt;&lt;i class=&quot;gm-line gm-d gm-dashed&quot;&gt;&lt;/i&gt;Dipole (GAD)&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;gm-plot-wrap&quot;&gt;&lt;svg id=&quot;gm-inclination&quot; role=&quot;img&quot; aria-label=&quot;Inclination versus latitude, comparing the combined magnetic field with the geocentric axial dipole prediction. Select a latitude to move the probe.&quot;&gt;&lt;/svg&gt;&lt;div id=&quot;gm-tooltip&quot; class=&quot;tooltip&quot; role=&quot;tooltip&quot; hidden&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;text-small text-muted gm-bottom&quot;&gt;Inclination uses the full horizontal field · vector arrows are projections · line density is illustrative&lt;/div&gt;
  &lt;section class=&quot;gm-equations&quot; aria-labelledby=&quot;gm-equations-title&quot;&gt;
    &lt;h3 id=&quot;gm-equations-title&quot;&gt;Equation setup&lt;/h3&gt;
    &lt;p&gt;Each component is an axisymmetric (zonal) dipole, quadrupole or octupole about its own independently chosen axis. Tilt moves that axis away from geographic north; azimuth sets its longitude, measured eastward from 0°. No spin control is needed about a symmetry axis. Examples restore all axes to geographic north; “Reset axes” preserves amplitudes.&lt;/p&gt;
    &lt;p&gt;Rotating a zonal component introduces nonzero orders in geographic coordinates, but does not span all possible degree-2 or degree-3 shapes. A general quadrupole has five coefficients and can be represented by two axes; a general octupole has seven coefficients. This playground varies the strength and orientation of one axisymmetric shape per degree.&lt;/p&gt;
    &lt;p&gt;Let a be the reference radius, ρ = r/a, r̂ the geographic radial unit vector, and âₙ the component&#x27;s unit axis. All coefficients share a fixed reference B₀ &amp;gt; 0. The signed amplitudes are local-axis Gauss coefficients divided by −B₀, not fractions of total field strength.&lt;/p&gt;
    &lt;div class=&quot;gm-math&quot; data-tex=&quot;\hat{\mathbf a}_n=(\sin t_n\cos\alpha_n,\cos t_n,\sin t_n\sin\alpha_n),\quad u_n=\hat{\mathbf a}_n\cdot\hat{\mathbf r}&quot;&gt;âₙ = (sin tₙ cos αₙ, cos tₙ, sin tₙ sin αₙ); uₙ = âₙ · r̂&lt;/div&gt;
    &lt;div class=&quot;gm-math&quot; data-tex=&quot;(g_1,g_2,g_3)=-B_0(D,Q,O),\quad V_n=a g_n\rho^{-n-1}P_n(u_n)&quot;&gt;(g₁, g₂, g₃) = −B₀(D, Q, O); Vₙ = a gₙ ρ⁻ⁿ⁻¹ Pₙ(uₙ)&lt;/div&gt;
    &lt;div class=&quot;gm-math&quot; data-tex=&quot;\mathbf B_n=g_n\rho^{-n-2}\left[\left((n+1)P_n(u_n)+u_nP&#x27;_n(u_n)\right)\hat{\mathbf r}-P&#x27;_n(u_n)\hat{\mathbf a}_n\right]&quot;&gt;Bₙ = gₙ ρ⁻ⁿ⁻² {[(n+1)Pₙ(uₙ) + uₙP′ₙ(uₙ)]r̂ − P′ₙ(uₙ)âₙ}&lt;/div&gt;
    &lt;p&gt;V = V₁ + V₂ + V₃ and B = −∇V = B₁ + B₂ + B₃. The Cartesian calculation above drives every view. The formulas below are the axial reference case only: tₙ = 0°, μ = sin λ, c = cos λ and gₙ = gₙ⁰.&lt;/p&gt;
    &lt;div class=&quot;gm-equation-grid&quot;&gt;
      &lt;div&gt;&lt;h4&gt;Dipole · n = 1&lt;/h4&gt;&lt;div class=&quot;gm-math&quot; data-tex=&quot;P_1(\mu)=\mu&quot;&gt;P₁(μ) = μ&lt;/div&gt;&lt;div class=&quot;gm-math&quot; data-tex=&quot;V_1=a g_1^0\rho^{-2}\mu&quot;&gt;V₁ = a g₁⁰ ρ⁻² μ&lt;/div&gt;&lt;div class=&quot;gm-math&quot; data-tex=&quot;B_{r,1}=2g_1^0\rho^{-3}\mu&quot;&gt;Bᵣ,₁ = 2 g₁⁰ ρ⁻³ μ&lt;/div&gt;&lt;div class=&quot;gm-math&quot; data-tex=&quot;B_{N,1}=-g_1^0\rho^{-3}c&quot;&gt;Bₙ,₁ = −g₁⁰ ρ⁻³ c&lt;/div&gt;&lt;/div&gt;
      &lt;div&gt;&lt;h4&gt;Quadrupole · n = 2&lt;/h4&gt;&lt;div class=&quot;gm-math&quot; data-tex=&quot;P_2(\mu)=\tfrac12(3\mu^2-1)&quot;&gt;P₂(μ) = (3 μ² − 1)/2&lt;/div&gt;&lt;div class=&quot;gm-math&quot; data-tex=&quot;V_2=a g_2^0\rho^{-3}P_2(\mu)&quot;&gt;V₂ = a g₂⁰ ρ⁻³ P₂(μ)&lt;/div&gt;&lt;div class=&quot;gm-math&quot; data-tex=&quot;B_{r,2}=3g_2^0\rho^{-4}P_2(\mu)&quot;&gt;Bᵣ,₂ = 3 g₂⁰ ρ⁻⁴ P₂(μ)&lt;/div&gt;&lt;div class=&quot;gm-math&quot; data-tex=&quot;B_{N,2}=-3g_2^0\rho^{-4}\mu c&quot;&gt;Bₙ,₂ = −3 g₂⁰ ρ⁻⁴ μ c&lt;/div&gt;&lt;/div&gt;
      &lt;div&gt;&lt;h4&gt;Octupole · n = 3&lt;/h4&gt;&lt;div class=&quot;gm-math&quot; data-tex=&quot;P_3(\mu)=\tfrac12(5\mu^3-3\mu)&quot;&gt;P₃(μ) = (5 μ³ − 3 μ)/2&lt;/div&gt;&lt;div class=&quot;gm-math&quot; data-tex=&quot;V_3=a g_3^0\rho^{-4}P_3(\mu)&quot;&gt;V₃ = a g₃⁰ ρ⁻⁴ P₃(μ)&lt;/div&gt;&lt;div class=&quot;gm-math&quot; data-tex=&quot;B_{r,3}=4g_3^0\rho^{-5}P_3(\mu)&quot;&gt;Bᵣ,₃ = 4 g₃⁰ ρ⁻⁵ P₃(μ)&lt;/div&gt;&lt;div class=&quot;gm-math&quot; data-tex=&quot;B_{N,3}=-\tfrac32g_3^0\rho^{-5}(5\mu^2-1)c&quot;&gt;Bₙ,₃ = −(3/2) g₃⁰ ρ⁻⁵ (5 μ² − 1) c&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p&gt;At the selected latitude and longitude, project the summed vector onto geographic north, east and down. East generally becomes nonzero when axes are tilted. North is positive toward geographic north; down is positive into Earth.&lt;/p&gt;
    &lt;p&gt;The radial-field lobe glyph samples Bᵣ at r = a and makes its display radius scale with |Bᵣ|. It is a scalar-field glyph, rather than Earth&#x27;s surface or a field-line trajectory. Surface colors also sample the field at r = a, including in glyph mode.&lt;/p&gt;
    &lt;div class=&quot;gm-math&quot; data-tex=&quot;B_N/B_0=c\left[D+3Q\mu+\tfrac32O(5\mu^2-1)\right]\quad(\rho=1)&quot;&gt;At r = a: Bₙ/B₀ = c[D + 3 Q μ + (3/2) O (5 μ² − 1)]&lt;/div&gt;
    &lt;div class=&quot;gm-math&quot; data-tex=&quot;B_D/B_0=2D\mu+\tfrac32Q(3\mu^2-1)+2O(5\mu^3-3\mu)\quad(\rho=1)&quot;&gt;At r = a: Bᴅ/B₀ = 2 D μ + (3/2) Q (3 μ² − 1) + 2 O (5 μ³ − 3 μ)&lt;/div&gt;
    &lt;div class=&quot;gm-math&quot; data-tex=&quot;B_D=-B_r,\quad H=\sqrt{B_N^2+B_E^2},\quad I=\operatorname{atan2}(B_D,H)&quot;&gt;Bᴅ = −Bᵣ; H = √(Bₙ² + Bₑ²); I = atan2(Bᴅ, H)&lt;/div&gt;
    &lt;div class=&quot;gm-math&quot; data-tex=&quot;\mathrm{Dec}=\operatorname{atan2}(B_E,B_N)&quot;&gt;Declination = atan2(Bₑ, Bₙ), positive east of north&lt;/div&gt;
    &lt;p&gt;Directions are undefined when |B| ≤ 10⁻⁹ B₀; declination is also undefined when H ≤ 10⁻⁹ B₀. The vector diagram offers north/down and north/east projections. Each shows the projected head-to-tail sum; inclination always uses the full H, including east.&lt;/p&gt;
    &lt;div class=&quot;gm-math&quot; data-tex=&quot;G_2=Q/D,\quad G_3=O/D\quad(D&amp;gt;0)&quot;&gt;G₂ = Q/D; G₃ = O/D, for D &amp;gt; 0 (local-axis amplitude ratios)&lt;/div&gt;
    &lt;div class=&quot;gm-math&quot; data-tex=&quot;\tan I_{\rm GAD}=2\tan\lambda,\qquad \lambda_{\rm inferred}=\arctan\!\left(\tfrac12\tan I\right)&quot;&gt;GAD: tan I = 2 tan λ; inferred λ = arctan[(tan I)/2]&lt;/div&gt;
    &lt;p&gt;The apparent GAD latitude is an inclination-only proxy, λ* = atan2(Bᴅ, 2H). It assumes a normal-polarity geographic GAD. It is suppressed for southward or vertical horizontal directions (Bₙ ≤ 10⁻⁹ B₀), and for a null field. No automatic polarity correction is made. Tilted or nondipole fields violate the GAD assumption, so this is not a geographic latitude estimate.&lt;/p&gt;
    &lt;p&gt;With all tilts at 0°, at 30°N, D = 1, Q = 0, O = +0.15 gives Bₙ/B₀ = 0.9147 and Bᴅ/B₀ = 0.7375. The octupole contribution is northward and upward here, so it partly cancels the dipole&#x27;s downward field: I changes from 49.1° to 38.9°.&lt;/p&gt;
    &lt;p&gt;The latitude chart is a surface slice at the selected longitude. Field lines are integrated in 3D from multiple longitudes. The selected-meridian camera projects true 3D traces onto that meridian; curves can leave the plane. For geographic axial fields only, seeds are restricted to that meridian to show the planar cells. The equatorial camera projects onto the equatorial plane, viewed from geographic north. Neither fixed camera shows a generally planar field-line solution.&lt;/p&gt;
    &lt;details&gt;&lt;summary&gt;Why does the axial octupole show six loops?&lt;/summary&gt;&lt;p&gt;“Octupole” labels degree 3. This axial m = 0 field has three field-line cells on either side of a meridional cross-section: six loop regions. Its radial-field map has four alternating latitude zones: two polar caps and two belts. A lobe glyph rotates those caps and belts around the axis. Other m terms have different geometries, including familiar eight-lobed patterns.&lt;/p&gt;&lt;p&gt;For a pure axial octupole, Bᵣ is zero at latitudes 0° and ±50.77°. Bθ is zero at ±26.565°, dividing each meridional half-plane into three field-line cells. Tilting rotates this axisymmetric pattern intact. General degree-3 shapes require additional parameters beyond those offered here.&lt;/p&gt;&lt;/details&gt;
    &lt;p class=&quot;text-small text-muted&quot;&gt;Sources: &lt;a href=&quot;https://doi.org/10.1007/BF00874956&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Winch &amp;amp; Slaucitajs (1966): multipole strengths and axes&lt;/a&gt; · &lt;a href=&quot;https://doi.org/10.1111/j.1365-246X.1982.tb04926.x&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Willis (1982): general quadrupole axes&lt;/a&gt; · &lt;a href=&quot;https://www.ncei.noaa.gov/products/international-geomagnetic-reference-field&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NOAA: geomagnetic potential&lt;/a&gt; · &lt;a href=&quot;https://spacephysics.ucla.edu/PotentialField/RotatablePotentialFields.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UCLA: multipole geometries&lt;/a&gt; · &lt;a href=&quot;https://doi.org/10.1016/j.pepi.2013.07.007&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Heimpel &amp;amp; Evans (2013): inclination anomalies&lt;/a&gt;. This is an idealized hypothesis explorer, rather than an IGRF reconstruction or a sediment-compaction model.&lt;/p&gt;
  &lt;/section&gt;
&lt;/div&gt;

&lt;script src=&quot;https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;geomag-lab&#x27;);
  const $ = id =&gt; root.querySelector(&#x27;#&#x27; + id);
  // PHYSICS_START
  const RAD = Math.PI / 180;
  function polynomials(s) {
    return [[s,1],[(3*s*s-1)/2,3*s],[(5*s*s*s-3*s)/2,(15*s*s-3)/2]];
  }
  const AXIAL_AXES = [[0,1,0],[0,1,0],[0,1,0]];
  const DIRECTION_EPS = 1e-9; // Field units relative to the fixed B0 reference.
  // World coordinates: +y = geographic north, +x = equator at 0°, +z = 90°E.
  function axisFromAngles(tilt,azimuth) {
    const t=tilt*RAD,a=azimuth*RAD;
    return [Math.sin(t)*Math.cos(a),Math.cos(t),Math.sin(t)*Math.sin(a)];
  }
  function geographicBasis(lat,lon=0) {
    const a=lat*RAD,b=lon*RAD,s=Math.sin(a),c=Math.cos(a),cp=Math.cos(b),sp=Math.sin(b);
    return {radial:[c*cp,s,c*sp],north:[-s*cp,c,-s*sp],east:[-sp,0,cp]};
  }
  const dot = (a,b) =&gt; a.reduce((v,x,j)=&gt;v+x*b[j],0);
  // Dimensionless r/R; g_n = -weight_n relative to B0. Each P_n is zonal
  // about its own unit axis. B = -grad V is evaluated directly in world space.
  function potentialAt(p,w,axes=AXIAL_AXES) {
    const r=Math.hypot(...p);
    if(r&lt;1e-12)return 0;
    const rhat=p.map(v=&gt;v/r);
    return w.reduce((v,a,j)=&gt;v-a*Math.pow(r,-j-2)*polynomials(dot(axes[j],rhat))[j][0],0);
  }
  function fieldAt(p,w,axes=AXIAL_AXES) {
    const r=Math.hypot(...p);
    if(r&lt;1e-12)return [0,0,0];
    const rhat=p.map(v=&gt;v/r),b=[0,0,0];
    for(let j=0;j&lt;3;j++) {
      if(w[j]===0)continue;
      const axis=axes[j],u=dot(axis,rhat),[P,dP]=polynomials(u)[j],g=-w[j]*Math.pow(r,-j-3);
      for(let k=0;k&lt;3;k++)b[k]+=g*(((j+2)*P+u*dP)*rhat[k]-dP*axis[k]);
    }
    return b;
  }
  function localAt(lat,w,axes=AXIAL_AXES,lon=0) {
    const basis=geographicBasis(lat,lon);
    const components=w.map((a,j)=&gt;{
      const b=fieldAt(basis.radial,w.map((v,k)=&gt;k===j?a:0),axes);
      return [dot(b,basis.north),-dot(b,basis.radial),dot(b,basis.east)];
    });
    const north=components.reduce((v,b)=&gt;v+b[0],0),down=components.reduce((v,b)=&gt;v+b[1],0),east=components.reduce((v,b)=&gt;v+b[2],0);
    const horizontal=Math.hypot(north,east),magnitude=Math.hypot(horizontal,down);
    const I=magnitude&gt;DIRECTION_EPS?Math.atan2(down,horizontal)/RAD:null;
    const declination=magnitude&gt;DIRECTION_EPS&amp;&amp;horizontal&gt;DIRECTION_EPS?Math.atan2(east,north)/RAD:null;
    const gad=Math.atan2(2*Math.sin(lat*RAD),Math.cos(lat*RAD))/RAD;
    // An inclination-only proxy under an assumed normal, geographic GAD.
    // Do not infer normal-polarity latitude for a southward or vertical field.
    const inferred=I!==null&amp;&amp;north&gt;DIRECTION_EPS?Math.atan2(down,2*horizontal)/RAD:null;
    return {north,east,down,components,horizontal,magnitude,I,declination,gad,inferred};
  }
  function surfaceStats(w,axes=AXIAL_AXES) {
    let maxRadial=0,maxStrength=0;
